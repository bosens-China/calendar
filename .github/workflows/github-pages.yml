name: Calendar CI and releases

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A re-run of an older commit must not cancel verification for a new push.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_attempt == '1' && 'current' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @calendar/shared build
      - run: pnpm test
      - run: pnpm --filter @calendar/server build
      - run: pnpm --filter @calendar/app build
      # The team build already type-checks the same frontend sources.
      - run: pnpm --filter @calendar/app exec vite build --mode pages --outDir dist-pages
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: packages/app/dist-pages

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Check main before deploying
        id: main-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$GITHUB_SHA" = "$current_sha" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping Pages deployment for a superseded commit."
          fi
      - id: deploy
        if: steps.main-head.outputs.publish == 'true'
        uses: actions/deploy-pages@v4

  docker-image:
    runs-on: ubuntu-latest
    outputs:
      publish-enabled: ${{ steps.dockerhub.outputs.enabled }}
    steps:
      - name: Check Docker Hub publishing configuration
        id: dockerhub
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: echo "enabled=$DOCKERHUB_CONFIGURED" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: calendar:ci
          cache-from: type=gha
          cache-to: ${{ steps.dockerhub.outputs.enabled == 'true' && 'type=gha,mode=max,ignore-error=true' || '' }}
      - run: node scripts/smoke-docker.mjs calendar:ci

  docker:
    if: needs.docker-image.outputs.publish-enabled == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [verify, docker-image]
    runs-on: ubuntu-latest
    concurrency:
      group: calendar-docker-${{ github.ref }}
      queue: max
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: calendar:ci-arm64
          cache-from: type=gha
      - name: Smoke-test arm64 image
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64
        run: node scripts/smoke-docker.mjs calendar:ci-arm64
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || 'boses/calendar' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
          flavor: latest=false
      - name: Check main before publishing
        id: main-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$GITHUB_SHA" != "$current_sha" ]; then
              echo "::notice::Skipping Docker publish for a superseded commit."
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: steps.main-head.outputs.publish == 'true'
        with:
          username: boses
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.main-head.outputs.publish == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
