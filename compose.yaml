services:
  calendar:
    image: ${CALENDAR_IMAGE:?Set CALENDAR_IMAGE in .env}
    ports:
      - "${CALENDAR_HOST:-127.0.0.1}:${CALENDAR_PORT:-3001}:3001"
    environment:
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-}
      ADMIN_INIT_EMAIL: ${ADMIN_INIT_EMAIL:-}
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - calendar-data:/data
    restart: unless-stopped

volumes:
  calendar-data:
